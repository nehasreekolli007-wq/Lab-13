name: Lab 13 - Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Python
        shell: powershell
        run: python --version

      - name: Check Git
        shell: powershell
        run: git --version

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Check Kubernetes
        shell: powershell
        run: kubectl get nodes

      - name: Check Project
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Project path: $env:LAB13_PROJECT_PATH"

          if ([string]::IsNullOrWhiteSpace($env:LAB13_PROJECT_PATH)) {
              throw "LAB13_PROJECT_PATH is missing."
          }

          if (-not (Test-Path -LiteralPath $env:LAB13_PROJECT_PATH)) {
              throw "Project folder not found."
          }

          Write-Host "Project folder found successfully."
